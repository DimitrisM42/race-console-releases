name: Request support
description: Ask for help using the public RACE CONSOLE app.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: "This request is public and requires a GitHub account. For private builds, contact Dimitris privately."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.187.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and game versions
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: "Tell us what you are trying to do and what you have already tried. Do not include private codes or personal information."
    validations:
      required: true
